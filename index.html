<style>
  :root{
    --ink:#2b2b28;
    --paper:#f6f3ee;
    --paper-2:#ece4d6;
    --teal:#6a9e97;
    --teal-deep:#456f68;
    --teal-pale:#dfeae7;
    --coral:#b15a37;
    --coral-pale:#f3ded2;
    --pink:#d98fa0;
    --pink-pale:#f6e1e6;
    --yellow:#dfc44f;
    --yellow-pale:#f8f0d3;
    --line:#d8d0bf;
    --ok:#4c8c6b;
    --ok-bg:#e2efe6;
    --ng:#c04b3f;
    --ng-bg:#f6e2df;
    --radius:18px;
    --shadow: 0 10px 30px -12px rgba(43,43,40,0.25);
  }
  *{box-sizing:border-box;}
  html{height:100%;}
  html,body{
    margin:0;padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  button, .pick-card, .egg-wrap, .quicklink, .order-btn{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 10px;
  }
  .brand{
    display:flex;align-items:center;gap:9px;
  }
  .brand-mark{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:13.5px;
    line-height:1.4;
    color:var(--teal-deep);
    letter-spacing:0.01em;
  }
  .brand-sub{
    font-size:11px;
    color:#8a8271;
    letter-spacing:0.08em;
  }
  .icon-btn{
    border:none;background:transparent;color:#8a8271;
    font-size:13px;padding:6px 10px;border-radius:999px;
    cursor:pointer;
  }
  .icon-btn:active{background:var(--paper-2);}
  .topbar-btns{display:flex;gap:2px;flex-shrink:0;}

  main{flex:1;padding:4px 18px 100px;}

  h2.section-title{
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    font-weight:700;
    margin:22px 0 10px;
    color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  h2.section-title .num{
    font-size:11px;
    background:var(--teal);
    color:#fff;
    width:20px;height:20px;
    border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:700;
  }
  h2.section-title .num.n2{background:var(--coral);}
  h2.section-title .num.n3{background:var(--pink);}
  h2.section-title .num.n4{background:var(--yellow);color:#5c4d16;}
  h2.section-title .num.n5{background:var(--teal-deep);}

  .app-mark{
    width:26px;height:26px;border-radius:8px;
    flex-shrink:0;
  }

  .quickrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .quicklink{
    font-size:12px;color:var(--teal-deep);
    background:var(--teal-pale);
    border:none;border-radius:999px;
    padding:6px 12px;
    cursor:pointer;
  }
  .quicklink:active{background:var(--teal);color:#fff;}

  .card-list{display:flex;flex-direction:column;gap:8px;}
  .pick-card{
    display:flex;align-items:center;justify-content:space-between;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .pick-card.selected{
    border-color:var(--teal);
    background:var(--teal-pale);
  }
  .pick-card .label{
    font-size:15px;font-weight:500;
  }
  .pick-card .count{
    font-size:12px;color:#8a8271;
    margin-left:8px;font-weight:400;
  }
  .pick-card .check{
    width:20px;height:20px;border-radius:6px;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;background:#fff;
  }
  .pick-card.selected .check{
    background:var(--teal);border-color:var(--teal);
    color:#fff;font-size:13px;
  }

  .unit-group{margin-bottom:6px;}
  .unit-group-title{
    font-size:12px;color:#8a8271;font-weight:700;
    margin:14px 2px 6px;letter-spacing:0.03em;
  }

物理", "unit": "力の種類とはたらき", "localNo": "46", "q": "磁石の同じ極どうしが反発する力を何というか。", "a": "磁力（斥力）"}, {"no": 47, "subject": "理科", "area": "物理", "unit": "力の種類とはたらき", "localNo": "47", "q": "1つの物体に2つの力がはたらいて物体が動かないとき，これらの力の関係を何というか。", "a": "力のつり合い"}, {"no": 48, "subject": "理科", "area": "物理", "unit": "圧力", "localNo": "48", "q": "面を垂直に押す力〔N〕を力を受ける面積〔m²〕で割ったもので求められるものは何か。", "a": "圧力"}, {"no": 49, "subject": "理科", "area": "物理", "unit": "圧力", "localNo": "49", "q": "圧力の大きさの単位Paを何と読むか。", "a": "パスカル"}, {"no": 50, "subject": "理科", "area": "物理", "unit": "圧力", "localNo": "50", "q": "同じ大きさの力がはたらいているとき，力がはたらく面積が小さいほど，圧力はどうなるか。", "a": "大きくなる"}, {"no": 51, "subject": "理科", "area": "物理", "unit": "圧力", "localNo": "51", "q": "地球をとりまいている空気の重さによる圧力を何というか。", "a": "大気圧（気圧）"}, {"no": 52, "subject": "理科", "area": "物理", "unit": "圧力", "localNo": "52", "q": "地上と山頂で，大気圧が大きいのはどちらか。", "a": "地上"}, {"no": 53, "subject": "理科", "area": "物理", "unit": "圧力", "localNo": "53", "q": "海面上での1気圧は約何hPaか。", "a": "約1013hPa"}, {"no": 54, "subject": "理科", "area": "物理", "unit": "圧力", "localNo": "54", "q": "水中の物体にはたらく上向きの力を何というか。", "a": "浮力"}, {"no": 55, "subject": "理科", "area": "物理", "unit": "静電気", "localNo": "55", "q": "ちがう種類の物質をたがいに摩擦したときに発生する電気を何というか。", "a": "静電気（摩擦電気）"}, {"no": 56, "subject": "理科", "area": "物理", "unit": "静電気", "localNo": "56", "q": "同じ種類の電気を帯びているものどうしの間には，どのような力がはたらくか。", "a": "しりぞけ合う力（反発する力）"}, {"no": 57, "subject": "理科", "area": "物理", "unit": "静電気", "localNo": "57", "q": "たまっていた電気が流れ出す現象を何というか。", "a": "放電"}, {"no": 58, "subject": "理科", "area": "物理", "unit": "電流と回路", "localNo": "58", "q": "電流が流れる道すじを何というか。", "a": "回路（電流回路）"}, {"no": 59, "subject": "理科", "area": "物理", "unit": "電流と回路", "localNo": "59", "q": "電流は，電池の何極から出るか。", "a": "＋極"}, {"no": 60, "subject": "理科", "area": "物理", "unit": "電流と回路", "localNo": "60", "q": "電気用図記号を使って回路全体を表したものを何というか。", "a": "回路図"}, {"no": 61, "subject": "理科", "area": "物理", "unit": "電流と回路", "localNo": "61", "q": "電流の通り道が枝分かれしていない回路を何というか。", "a": "直列回路"}, {"no": 62, "subject": "理科", ": "物理", "unit": "電流のはたらき", "localNo": "92", "q": "1gの水を1℃上昇させるのに必要な熱量は何Jか。", "a": "（約）4.2J"}, {"no": 93, "subject": "理科", "area": "物理", "unit": "電流のはたらき", "localNo": "93", "q": "電流の流れる向きが周期的に変わる電流を何というか。", "a": "交流（電流）"}, {"no": 94, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "94", "q": "2力を合成して求めた力を何というか。", "a": "合力"}, {"no": 95, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "95", "q": "1つの力を分解して求めた力を何というか。", "a": "分力"}, {"no": 96, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "96", "q": "ある区間を一定の速さで走ったとみなしたときの速さを何というか。", "a": "平均の速さ"}, {"no": 97, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "97", "q": "ごく短い時間に移動した距離をその時間で割って求めた速さで，スピードメーターが示す速さを何というか。", "a": "瞬間の速さ"}, {"no": 98, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "98", "q": "1秒間に60打点打つ記録タイマーでは，6打点打つのに何秒かかるか。", "a": "0.1秒"}, {"no": 99, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "99", "q": "記録タイマーの打点間隔が広がっていく運動は，速さがどうなる運動か。", "a": "大きくなる運動"}, {"no": 100, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "100", "q": "物体を，一定時間ごとに発光する装置で撮影した写真を何というか。", "a": "ストロボ写真"}, {"no": 101, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "101", "q": "斜面を下る台車の運動は，速さがどうなる運動か。", "a": "大きくなる運動"}, {"no": 102, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "102", "q": "斜面の角度を大きくすると，斜面を下る台車の速さの変化はどうなるか。", "a": "大きくなる"}, {"no": 103, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "103", "q": "斜面をのぼる台車の運動は，速さがどうなる運動か。", "a": "小さくなる運動"}, {"no": 104, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "104", "q": "速さが大きくなる運動で，物体にはたらき続けているものは何か。", "a": "運動と同じ向きの力"}, {"no": 105, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "105", "q": "速さが小さくなる運動では，物体には運動の向きに対してどのような向きの力がはたらいているか。", "a": "逆向きの力"}, {"no": 106, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "106", "q": "一直線上を動く運動で，力がはたらかないか，はたらいている力がつり合っている状態にある物体の運動を何というか。", "a": "等速直線運動"}, {"no": 107, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "107", "q": "等速直線運動では，移動距離と時間にはどのような関係があるか。", "a": "比例（の関係）"}, {"no": 108, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "108", "q": "外から力がはたらかないかぎり，物体が運動のようすを変えずに，その運動の状態を続けようとする性質を何というか。", "a": "慣性"}, {"no": 109, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "109", "q": "力がはたらかないかぎり，静止している物体は静止し続け，動いている物体は等速直線運動を続けるという法則を何というか。", "a": "慣性の法則"}, {"no": 110, "subject": "理科", "area": "物理", "unit": "運動と力", "localNo": "110", "q": "ある物体に力を加えると，同時にその物体から反対向きに同じ大きさの力を受ける法則を何というか。", "a": "作用・反作用の法則"}, {"no": 111, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "111", "q": "基準面より高いところにある物体がもっているエネルギーを何エネルギーというか。", "a": "位置エネルギー"}, {"no": 112, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "112", "q": "運動している物体がもっているエネルギーを何エネルギーというか。", "a": "運動エネルギー"}, {"no": 113, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "113", "q": "位置エネルギーと運動エネルギーは互いに移り変わるが，摩擦などがないときその和が一定に保たれることを何の法則というか。", "a": "力学的エネルギー保存の法則"}, {"no": 114, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "114", "q": "100gの物体が1mの高さにあるときの位置エネルギーを単位をつけて表すとどうなるか。", "a": "1J（ジュール）"}, {"no": 115, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "115", "q": "光電池に光を当てたら，電圧を生じて導線に電流が流れた。このとき，何エネルギーから何エネルギーに変換したか。", "a": "光エネルギーから電気エネルギー"}, {"no": 116, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "116", "q": "原子核が持っていて，核分裂などの反応で取り出すことのできるエネルギーを何というか。", "a": "核エネルギー"}, {"no": 117, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "117", "q": "エネルギーが移り変わる前後で，エネルギー全体の量が一定に保たれることを何の法則というか。", "a": "エネルギー保存の法則"}, {"no": 118, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "118", "q": "物体に力を加えて，力の向きに移動させたとき，力は物体に対して何をしたというか。", "a": "仕事"}, {"no": 119, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "119", "q": "1秒間あたりの仕事を何というか。", "a": "仕事率"}, {"no": 120, "subject": "理科", "area": "物理", "unit": "仕事とエネルギー", "localNo": "120", "q": "仕事率の単位は何か。", "a": "W（ワット）"}, {"no a": "形質"}, {"no": 709, "subject": "理科", "area": "生物", "unit": "遺伝", "localNo": "167", "q": "形質を親から子へ伝えるもとになるものを何というか。", "a": "遺伝子"}, {"no": 710, "subject": "理科", "area": "生物", "unit": "遺伝", "localNo": "168", "q": "遺伝子は細胞のどこにあるか。", "a": "染色体"}, {"no": 711, "subject": "理科", "area": "生物", "unit": "遺伝", "localNo": "169", "q": "染色体は細胞のどこにあるか。", "a": "核"}, {"no": 712, "subject": "理科", "area": "生物", "unit": "遺伝", "localNo": "170", "q": "親から子へ受けつがれる形質と、環境によって変化する形質の両方を何というか。", "a": "形質"}, {"no": 713, "subject": "理科", "area": "生物", "unit": "生物どうしのつながり", "localNo": "171", "q": "ある地域での生物の数量関係をピラミッドで表したとき、ピラミッドの底面にくるのはどのような生物か。", "a": "生産者"}, {"no": 714, "subject": "理科", "area": "生物", "unit": "生物どうしのつながり", "localNo": "172", "q": "糸のような菌糸でからだができているカビやキノコのなかまを何というか。", "a": "菌類"}, {"no": 715, "subject": "理科", "area": "生物", "unit": "生物どうしのつながり", "localNo": "173", "q": "ニュウサンキンやナットウキンのなかまを何というか。", "a": "細菌類"}, {"no": 716, "subject": "理科", "area": "生物", "unit": "生物どうしのつながり", "localNo": "174", "q": "有機物を無機物に分解する働きをしている土中の小動物・菌類・細菌類を、生物どうしのつながりにおける呼ばれ方を何というか。", "a": "分解者"}, {"no": 717, "subject": "理科", "area": "生物", "unit": "生物どうしのつながり", "localNo": "175", "q": "地球上の生物が利用している大気中の酸素は、何というはたらきでつくられているか。", "a": "光合成"}, {"no": 718, "subject": "理科", "area": "生物", "unit": "生物どうしのつながり", "localNo": "176", "q": "生物が、酸素を利用して有機物からエネルギーを取り出すはたらきを何というか。", "a": "呼吸"}, {"no": 719, "subject": "理科", "area": "生物", "unit": "遺伝の規則性と遺伝子", "localNo": "177", "q": "代を重ねてもその形質がすべて親と同じである場合、これを何というか。", "a": "純系"}, {"no": 720, "subject": "理科", "area": "生物", "unit": "遺伝の規則性と遺伝子", "localNo": "178", "q": "形質が異なる純系を交配したとき、子に現れる形質を何というか。", "a": "顕性形質（顕性の形質）"}, {"no": 721, "subject": "理科", "area": "生物", "unit": "遺伝の規則性と遺伝子", "localNo": "179", "q": "ある形質において、同時に現れない2つの対になる形質を何というか。", "a": "対立形質"}, {"no": 722, "subject": "理科", "area": "生物", "unit": "遺伝の規則性と遺伝子", "localNo": "180", "q": "減数分裂で対になっている遺伝子が別々の生殖細胞に分かれて入ることを何の法則というか。", "a": "分離の法則"}, {"no": 723, "subject": "理科", "area": "生物", "unit": "遺伝の規則性と遺伝子", "localNo": "181", "q": "遺伝の父といわれる、エンドウを使って実験したオーストリア人はだれか。", "a": "メンデル"}, {"no": 724, "subject": "理科", "area": "生物", "unit": "環境", "localNo": "182", "q": "生物が取り込んだ物質が体内に蓄積されて濃度が高くなることを何というか。", "a": "生物濃縮"}, {"no": 725, "subject": "理科", "area": "生物", "unit": "環境", "localNo": "183", "q": "本来分布していなかった地域に移入されて定着した生物のことを何というか。", "a": "外来種"}, {"no": 726, "subject": "理科", "area": "生物", "unit": "環境", "localNo": "184", "q": "海や湖が工場排水などで水質が悪化して赤潮やアオコが発生することを何というか。", "a": "水質汚濁"}, {"no": 727, "subject": "理科", "area": "生物", "unit": "環境", "localNo": "185", "q": "持続可能な社会のために、環境と共生する化学のことを何というか。", "a": "GSC（グリーンサステイナブルケミストリー）"}, {"no": 728, "subject": "理科", "area": "生物", "unit": "環境", "localNo": "186", "q": "ある製品について原料の入手からすべての過程において環境への影響を評価する方法を何というか。", "a": "LCA（ライフサイクルアセスメント）"}, {"no": 729, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "1", "q": "スウェーデンの生物・植物学者。分類学の基礎を確立し、「分類学の父」と呼ばれる。生物に学名を命名する方法を確立した。", "a": "カール・フォン・リンネ"}, {"no": 730, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "2", "q": "日本の植物学者。新種をたくさん発見し、命名すると共にくわしい植物図鑑を作成した。「日本の植物学の父」と呼ばれる。", "a": "牧野富太郎"}, {"no": 731, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "3", "q": "イギリスの数学・物理学者。運動の法則、万有引力の法則を発見した。反射望遠鏡を発明、力の大きさの単位の由来。", "a": "アイザック・ニュートン"}, {"no": 732, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "4", "q": "古代ギリシャの数学・物理学者。液体中の物体にはたらく浮力に関するアルキメデスの原理やてこの原理を発見した。", "a": "アルキメデス"}, {"no": 733, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "5", "q": "フランスの数学・物理学者。「静止した流体中に加わる圧力はすべて等しい」というパスカルの原理を提唱。圧力の単位の由来。", "a": "ブレーズ・パスカル"}, {"no": 734, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "6", "q": "イギリスの物理・化学者。「ばねの伸びは力に比例する」というフックの法則を発見し、コルクを観察しCell（細胞）と命名。", "a": "ロバート・フック"}, {"no": 735, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "7", "q": "ドイツの植物・生物学者。植物の細胞説を提唱した。", "a": "マティアス・ヤーコプ・シュライデン"}, {"no": 736, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "8", "q": "ドイツの生物・動物学者。動物の細胞説を提唱した。胃液の消化酵素ペプシンの発見者でもある。", "a": "テオドール・シュワン"}, {"no": 737, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "9", "q": "イギリスの地質・生物学者。「種の起源」を出版、自然選択説による進化論を提唱した。", "a": "チャールズ・ダーウィン"}, {"no": 738, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "10", "q": "日本の物理学者。雪の結晶を研究し、人工雪の製作に世界で初めて成功した。", "a": "中谷宇吉郎"}, {"no": 739, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "11", "q": "イギリスの化学・物理学者。物質の最小構成単位が原子であるとする原子説を提唱した。", "a": "ジョン・ドルトン"}, {"no": 740, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "12", "q": "イタリアの化学・物理学者。気体は2個以上の原子が集まった分子でできていると考えた分子説を提唱した。", "a": "アメデオ・アボガドロ"}, {"no": 741, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "13", "q": "ロシアの化学・物理学者。原子を質量の順に並べると性質の似たものが周期的に現れることを見出し、周期表を作成した。", "a": "ドミトリ・メンデレーエフ"}, {"no": 742, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "14", "q": "フランスの化学者。精密な燃焼の実験を行い、質量保存の法則を発見した。酸素の命名者で、フロギストン説を打破した。", "a": "アントワーヌ・ラボアジエ"}, {"no": 743, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "15", "q": "フランスの化学者。「化合物をつくっている成分の質量の比が常に一定である」という定比例の法則を提唱した。", "a": "ジョゼフ・プルースト"}, {"no": 744, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "16", "q": "フランスの物理学者。電磁気学の創始者の一人。右ねじの法則（右手の法則）を発見した。電流の単位の由来。", "a": "アンドレ＝マリ・アンペール"}, {"no": 745, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "17", "q": "イタリアの物理学者。世界初の化学電池であるボルタ電池を発明した。電圧の単位の由来。", "a": "アレッサンドロ・ボルタ"}, {"no": 746, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "18", "q": "ドイツの物理学者。「電流が加えた電圧に比例する」というオームの法則（V＝IR）を発見した。電気抵抗の単位の由来。", "a": "ゲオルク・オーム"}, {"no": 747, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "19", "q": "イギリスの発明家。蒸気機関の改良を行い、産業革命の原動力となった。仕事率、電力の単位の由来。", "a": "ジェームズ・ワット"}, {"no": 748, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "20", "q": "イギリスの物理学者。電流により発生する熱に関するジュールの法則、エネルギー保存の法則を発見。熱量の単位の由来。", "a": "ジェームズ・プレスコット・ジュール"}, {"no": 749, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "21", "q": "イギリスの物理学者。放電管の実験においてX線を発見した。", "a": "ヴィルヘルム・レントゲン"}, {"no": 750, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "22", "q": "イギリスの物理学者。気体の放電現象を研究し、陰極線の特性を調べる過程で電子を発見した。", "a": "ジョゼフ・ジョン・トムソン"}, {"no": 751, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "23", "q": "フランスの化学・物理学者。ウランの放射線を発見した。放射能の単位の由来。", "a": "アンリ・ベクレル"}, {"no": 752, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "24", "q": "ポーランドの物理学者。放射線を出す物質を研究し、ポロニウムとラジウムを発見した。放射能、放射性元素の命名者。", "a": "マリー・キュリー"}, {"no": 753, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "25", "q": "イギリスの物理学者。電磁誘導に関して、電流と磁界の関係を表すフレミングの法則（右手の法則、左手の法則）を考案した。", "a": "ジョン・フレミング"}, {"no": 754, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "26", "q": "ロシアの物理学者。「誘導電流の流れる方向は誘導電流の原因を妨げる方向と一致する」というレンツの法則を発見した。", "a": "ハインリヒ・レンツ"}, {"no": 755, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "27", "q": "イギリスの化学・物理学者。電磁誘導の法則を発見し、モーターを発明した。電気分解の研究においてイオンを考案した。", "a": "マイケル・ファラデー"}, {"no": 756, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "28", "q": "日本の発明家。ブラウン管方式の電子式テレビジョンを発明（「イ」の文字の送受信実験に成功した）。", "a": "高柳健次郎"}, {"no": 757, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "29", "q": "オーストリアの植物学者。遺伝学の祖。エンドウで遺伝の研究をし、メンデルの法則を発見した。", "a": "グレゴール・ヨハン・メンデル"}, {"no": 758, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "30", "q": "アメリカの分子生物学者とイギリスの物理・分子生物学者。DNAが二重らせん構造であることを共同で発見した。", "a": "ジェームズ・ワトソン（米）とフランシス・クリック（英）"}, {"no": 759, "subject": "理科", "area": "教科書に登場する科学者", "unit": "教科書に登場する科学者", "localNo": "31", "q": "日本の医学者。iPS細胞（人工多能性幹細胞）の開発に成功した。", "a": "山中伸弥"}, 後に成立した中華民国の臨時大総統となった人物はだれか。", "a": "孫文"}]</script>
<script>
const QUESTIONS = JSON.parse(document.getElementById('qdata').textContent);

/* ---------- storage helpers ----------
   Claude内蔵のwindow.storageが使える場合はそれを優先し、
   ファイルを直接ブラウザで開いている場合はlocalStorageにフォールバックする。
*/
function hasClaudeStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
async function storageGetRaw(key){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(key);
      if(res && res.value !== undefined && res.value !== null) return res.value;
    }catch(e){ /* 未作成キーなどはlocalStorageも試す */ }
  }
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSetRaw(key, value){
  if(hasClaudeStorage()){
    try{ await window.storage.set(key, value); }catch(e){}
  }
  try{ window.localStorage.setItem(key, value); }catch(e){}
}

async function loadStats(){
  try{
    const raw = await storageGetRaw('qstats_v1');
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
async function saveStats(stats){
  try{ await storageSetRaw('qstats_v1', JSON.stringify(stats)); }catch(e){}
}

/* ---------- creature system ---------- */
async function loadCreatures(){
  try{
    const raw = await storageGetRaw('creatures_v1');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
async function saveCreatures(list){
  try{ await storageSetRaw('creatures_v1', JSON.stringify(list)); }catch(e){}
}

const STAGES = [
  {min:0,   label:'たまご'},
  {min:10,  label:'ひびわれたまご'},
  {min:25,  label:'ようじ'},
  {min:50,  label:'こども'},
  {min:100, label:'せいちょう'},
  {min:200, label:'でんせつ'},
];
function stageIndexFromLifetime(n){
  let idx = 0;
  STAGES.forEach((s,i)=>{ if(n>=s.min) idx=i; });
  return idx;
}
function lifetimeCorrect(stats){
  return Object.values(stats||{}).reduce((s,v)=>s+(v.correct||0),0);
}

const QUALITIES = [
  {min:0,   label:'ノーマル', badgeBg:'#e4e1d6', badgeFg:'#6b6355', palette:['#b9c2b4','#8fa088']},
  {min:0.5, label:'グッド',   badgeBg:'#dfeae7', badgeFg:'#3f6b64', palette:['#8fc2b6','#5f8f88']},
  {min:0.7, label:'レア',     badgeBg:'#f3ded6', badgeFg:'#a5522f', palette:['#f2b48a','#dd8850']},
  {min:0.85,label:'エピック', badgeBg:'#ece0f5', badgeFg:'#7a4a9c', palette:['#cfa3ea','#a86bd6']},
  {min:0.95,label:'レジェンド',badgeBg:'#fff2cf', badgeFg:'#a5780a', palette:['#ffd97a','#ff9f5a','#ff7fb0','#7fd6ff']},
];
function qualityIndexFromRate(rate){
  let idx = 0;
  QUALITIES.forEach((q,i)=>{ if(rate>=q.min) idx=i; });
  return idx;
}

const NAME_A = ['モコ','フワ','ピカ','ズキ','コロ','ペタ','ギラ','トロ','シャラ','ムニュ','キラ','ボヤ','ハネ','ツキ','ホシ'];
const NAME_B = ['リン','ポン','ムチ','ゲル','ワン','ドン','キュル','ラン','トル','ミュ','ゾロ','ピョ'];
const NAME_SUFFIX_BY_STAGE = ['たま','たまご','ぴょん','もん','オン','ザウルス'];

const FLAVOR_GENERIC = [
  '寝る前に必ず一回転する。',
  '正解の数だけ光る粒を集めているらしい。',
  '機嫌がいいと耳がふわふわ揺れる。',
  '実は夜のほうが元気になるタイプ。',
  '好物は「あと少し」という言葉。',
  '触るとほんのり温かい。',
  '静かな場所で育つとよく懐く。',
];
const FLAVOR_BY_AREA = {
  '物理':['光と音をエネルギーに変えて動いている。','雷が鳴ると機嫌がよくなる。'],
  '化学':['体温が上がると色が変わる不思議な体を持つ。','混ぜてはいけない性格をしている。'],
  '地学':['背中に小さな火山を隠し持っている。','地層のように模様が層になっている。'],
  '生物':['羽と尻尾、両方生えている珍しいタイプ。','細胞1個から育ったという噂がある。'],
  '教科書に登場する科学者':['偉人の名言をつぶやきながら眠る。','紙とペンの匂いが好き。'],
  '公民':['みんなの意見をまとめるのが得意。','いつも公平な顔をしている。'],
  '地理':['世界中のにおいを覚えている。','地図を見るとそわそわし出す。'],
  '歴史':['大昔の言葉で鳴くことがある。','古い巻物のような匂いがする。'],
};

function pickRand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function buildCreature(sessionCorrect, sessionTotal, lifetimeTotal, areas){
  const stageIdx = stageIndexFromLifetime(lifetimeTotal);
  const rate = sessionTotal ? sessionCorrect/sessionTotal : 0;
  const qualityIdx = qualityIndexFromRate(rate);
  const stage = STAGES[stageIdx];
  const quality = QUALITIES[qualityIdx];

  const name = pickRand(NAME_A) + pickRand(NAME_B) + NAME_SUFFIX_BY_STAGE[stageIdx];
  const pool = (areas && areas.length && FLAVOR_BY_AREA[areas[0]]) ? FLAVOR_BY_AREA[areas[0]].concat(FLAVOR_GENERIC) : FLAVOR_GENERIC;
  const flavor = pickRand(pool);

  return {
    id: Date.now()+'-'+Math.floor(Math.random()*10000),
    date: new Date().toISOString(),
    name, flavor,
    stageIdx, stageLabel: stage.label,
    qualityIdx, qualityLabel: quality.label,
    sessionCorrect, sessionTotal, rate,
    lifetimeTotal,
    eyeType: pickRand(['normal','sleepy','star']),
    earType: pickRand(['none','cat','antenna','petal']),
    hasCheeks: Math.random() < 0.6,
    hasTail: stageIdx>=3,
    hasWings: stageIdx>=4,
    sparkle: qualityIdx>=3 || stageIdx>=5,
  };
}

function nextStageNote(stageIdx, lifetimeTotal){
  if(stageIdx >= STAGES.length-1){
    return `現在の育成段階は最高段階の「${STAGES[stageIdx].label}」！（累計${lifetimeTotal}問正解）`;
  }
  const next = STAGES[stageIdx+1];
  const remain = Math.max(0, next.min - lifetimeTotal);
  return `累計${lifetimeTotal}問正解・次の進化「${next.label}」まであと${remain}問`;
}

function renderEggSVG(qualityIdx, wiggleSeed){
  const q = QUALITIES[qualityIdx];
  const pal = q.palette;
  const c1 = pal[0], c2 = pal[pal.length-1];
  const gid = 'egg'+wiggleSeed;
  let s = `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>
    <ellipse cx="80" cy="90" rx="42" ry="52" fill="url(#${gid})"/>
    <ellipse cx="64" cy="66" rx="11" ry="8" fill="#ffffff" opacity="0.35"/>`;
  if(qualityIdx>=3){
    s += `<g opacity="0.9">
      <path d="M22 44 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="${c2}"/>
      <path d="M134 108 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="${c1}"/>
    </g>`;
  }
  s += `</svg>`;
  return s;
}

function renderCreatureSVG(c, small){
  const q = QUALITIES[c.qualityIdx];
  const pal = q.palette;
  const c1 = pal[0], c2 = pal[pal.length-1];
  const gid = 'g'+c.id.replace(/[^a-zA-Z0-9]/g,'');
  let s = `<svg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/>
    </linearGradient></defs>`;

  // stage0-1: 小さな赤ちゃん生物（耳や脚はまだない）。stageが上がるほどパーツが増える。
  const hasLegs = c.stageIdx>=1;
  const hasEars = c.stageIdx>=2;

  if(c.hasWings){
    s += `<ellipse cx="38" cy="78" rx="24" ry="14" fill="${c1}" opacity="0.85" transform="rotate(-20 38 78)"/>
          <ellipse cx="122" cy="78" rx="24" ry="14" fill="${c1}" opacity="0.85" transform="rotate(20 122 78)"/>`;
  }
  if(c.hasTail){
    s += `<path d="M100 130 Q135 120 128 150 Q112 138 100 130" fill="${c2}"/>`;
  }
  // legs
  if(hasLegs){
    s += `<ellipse cx="62" cy="136" rx="12" ry="8" fill="${c2}"/><ellipse cx="98" cy="136" rx="12" ry="8" fill="${c2}"/>`;
  }
  // ears
  if(hasEars){
    if(c.earType==='cat'){
      s += `<path d="M50 50 L58 22 L72 48 Z" fill="url(#${gid})"/><path d="M110 50 L102 22 L88 48 Z" fill="url(#${gid})"/>`;
    } else if(c.earType==='antenna'){
      s += `<line x1="80" y1="40" x2="80" y2="16" stroke="${c2}" stroke-width="3"/><circle cx="80" cy="12" r="6" fill="${c2}"/>`;
    } else if(c.earType==='petal'){
      s += `<ellipse cx="52" cy="38" rx="10" ry="16" fill="${c1}" transform="rotate(-25 52 38)"/><ellipse cx="108" cy="38" rx="10" ry="16" fill="${c1}" transform="rotate(25 108 38)"/>`;
    }
  }
  if(c.stageIdx>=5){
    s += `<path d="M60 42 L64 24 L70 42 Z" fill="#fff"/><path d="M100 42 L96 24 L90 42 Z" fill="#fff"/>`;
  }
  // body（赤ちゃんの間は少し小さめの丸い体）
  const bodyR = c.stageIdx===0 ? 40 : 46;
  s += `<ellipse cx="80" cy="92" rx="${bodyR}" ry="${bodyR-2}" fill="url(#${gid})"/>`;
  // cheeks
  if(c.hasCheeks){
    s += `<circle cx="58" cy="98" r="7" fill="#ff9fae" opacity="0.55"/><circle cx="102" cy="98" r="7" fill="#ff9fae" opacity="0.55"/>`;
  }
  // eyes
  if(c.eyeType==='sleepy'){
    s += `<path d="M62 88 Q68 94 74 88" stroke="#2b2b28" stroke-width="3" fill="none"/><path d="M86 88 Q92 94 98 88" stroke="#2b2b28" stroke-width="3" fill="none"/>`;
  } else if(c.eyeType==='star'){
    s += `<path d="M68 82 l3 6 6 1 -4 4 1 6 -6 -3 -6 3 1 -6 -4 -4 6 -1 z" fill="#2b2b28"/>
          <path d="M92 82 l3 6 6 1 -4 4 1 6 -6 -3 -6 3 1 -6 -4 -4 6 -1 z" fill="#2b2b28"/>`;
  } else {
    s += `<circle cx="68" cy="90" r="6.5" fill="#2b2b28"/><circle cx="92" cy="90" r="6.5" fill="#2b2b28"/>
          <circle cx="70" cy="87.5" r="1.8" fill="#fff"/><circle cx="94" cy="87.5" r="1.8" fill="#fff"/>`;
  }
  // mouth
  s += `<path d="M72 104 Q80 110 88 104" stroke="#2b2b28" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;

  if(c.sparkle){
    s += `<g opacity="0.9">
      <path d="M20 40 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="${c2}"/>
      <path d="M136 110 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="${c1}"/>
      <path d="M132 36 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z" fill="${c2}"/>
    </g>`;
  }

  s += `</svg>`;
  return s;
}

/* ---------- data model ---------- */
const AREA_ORDER = ['物理','化学','地学','生物','教科書に登場する科学者','公民','地理','歴史'];
function areasBySubject(){
  const map = {};
  QUESTIONS.forEach(q=>{
    if(!map[q.subject]) map[q.subject] = new Set();
    map[q.subject].add(q.area);
  });
  const out = {};
  Object.keys(map).forEach(s=>{ out[s] = AREA_ORDER.filter(a=>map[s].has(a)); });
  return out;
}
function unitsByArea(areas){
  const map = {};
  QUESTIONS.forEach(q=>{
    if(!areas.includes(q.area)) return;
    if(!map[q.area]) map[q.area] = [];
    if(!map[q.area].includes(q.unit)) map[q.area].push(q.unit);
  });
  return map;
}
function countFor(areas, units){
  return QUESTIONS.filter(q=> areas.includes(q.area) && (!units.length || units.includes(q.unit))).length;
}
function localNoNum(localNo){
  const m = String(localNo).match(/\d+/);
  return m ? parseInt(m[0],10) : 0;
}

function getFilteredQuestions(){
  let list = QUESTIONS.filter(q=>state.selectedAreas.includes(q.area));
  if(state.selectedUnits.length){
    list = list.filter(q=>state.selectedUnits.includes(q.unit));
  }
  const from = state.rangeFrom ? parseInt(state.rangeFrom,10) : null;
  const to = state.rangeTo ? parseInt(state.rangeTo,10) : null;
  if(from || to){
    list = list.filter(q=>{
      const n = localNoNum(q.localNo);
      if(from && n < from) return false;
      if(to && n > to) return false;
      return true;
    });
  }
  return list;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function quizCountLabel(matchedTotal){
  const n = state.count ? Math.min(parseInt(state.count,10), matchedTotal) : matchedTotal;
  return n + '問' + (state.count && n < matchedTotal ? `（全${matchedTotal}問中）` : '');
}

async function startQuiz(){
  let list = getFilteredQuestions();
  if(state.order==='random') list = shuffle(list);
  else list = list.slice().sort((a,b)=> a.no-b.no);
  if(state.count){
    const n = parseInt(state.count,10);
    if(n>0 && n<list.length) list = list.slice(0,n);
  }
  state.quizList = list;
  state.quizIndex = 0;
  state.revealed = false;
  state.answers = {};
  state.creature = null;
  state.hatched = false;
  state.stats = await loadStats();
  state.screen = 'quiz';
  render();
}

  root.appendChild(header);

  const fill = el('div','progress-fill');

  track.appendChild(fill);
  root.appendChild(track);

  }

  if(state.revealed){
    const jrow = el('div','judge-row');

    const ngBtn = el('button','judge-btn judge-ng','×<span class="jsub">不正解</span>');
    okBtn.onclick = ()=> judge(q, true);
    ngBtn.onclick = ()=> judge(q, false);
    jrow.appendChild(okBtn); jrow.appendChild(ngBtn);
    body.appendChild(jrow);
  }

  root.appendChild(body);

  const footer = el('div','quiz-footer');
  const endLink = el('button','end-link','ここで終わる（今までの結果を見る）');
  endLink.onclick = ()=>{ state.screen='result'; render(); };
  footer.appendChild(endLink);
  root.appendChild(footer);
}

function judge(q, correct){
  state.answers[q.no] = correct ? 'ok' : 'ng';
  if(!state.stats[q.no]) state.stats[q.no] = {attempts:0, correct:0};
  state.stats[q.no].attempts += 1;
  if(correct) state.stats[q.no].correct += 1;
  saveStats(state.stats); // 保存は待たずに進める

  if(state.quizIndex < state.quizList.length - 1){
    state.quizIndex += 1;
    state.revealed = false;
    render();
  } else {
    state.screen = 'result';
    render();
  }
}

function goToPrevious(){
  if(state.quizIndex <= 0) return;
  state.quizIndex -= 1;
  const q = state.quizList[state.quizIndex];
  if(state.answers[q.no] !== undefined){
    const wasCorrect = state.answers[q.no] === 'ok';
    if(state.stats[q.no]){
      state.stats[q.no].attempts = Math.max(0, state.stats[q.no].attempts - 1);
      if(wasCorrect) state.stats[q.no].correct = Math.max(0, state.stats[q.no].correct - 1);
    }
    delete state.answers[q.no];
    saveStats(state.stats);
  }
  state.revealed = false;
  render();
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------- render: result screen ---------- */
function renderResult(){
  root.innerHTML = '';
  const top = el('div','topbar');
  top.innerHTML = `<div class="brand"><span class="brand-mark">結果</span></div>`;
  root.appendChild(top);

  const answered = Object.keys(state.answers).length;
  const correct = Object.values(state.answers).filter(v=>v==='ok').length;
  const rate = answered ? Math.round(correct/answered*100) : 0;

  const hero = el('div','result-hero');
  hero.innerHTML = `<div class="result-score">${correct}<span> / ${answered}問</span></div><div class="result-rate">正答率 ${rate}%</div>`;
  root.appendChild(hero);

  const main = el('main');

  // 生き物カード
  if(answered > 0){
    if(!state.creature){
      state.creature = buildCreature(correct, answered, lifetimeCorrect(state.stats), state.selectedAreas);
    }
    main.appendChild(renderCreatureCard());
  }

  // unit breakdown for this session
  const byUnit = {};
  state.quizList.forEach(q=>{
    if(state.answers[q.no] === undefined) return;
    const key = q.area+'｜'+q.unit;
    if(!byUnit[key]) byUnit[key] = {total:0, correct:0};
    byUnit[key].total += 1;
    if(state.answers[q.no]==='ok') byUnit[key].correct += 1;
  });

  if(Object.keys(byUnit).length){
    main.appendChild(el('h2','section-title','今回の単元別結果'));
    Object.keys(byUnit).forEach(key=>{
      const d = byUnit[key];
      const pct = Math.round(d.correct/d.total*100);
      const row = el('div','unit-result');
      row.innerHTML = `
        <div class="unit-result-top"><span>${key.split('｜')[1]}</span><span>${d.correct}/${d.total}</span></div>
        <div class="unit-bar-track"><div class="unit-bar-fill" style="width:${pct}%"></div></div>
      `;
      main.appendChild(row);
    });
  }

  const actions = el('div','result-actions');
  const retryWrong = el('button','btn-primary','間違えた問題だけ復習する');
  const wrongList = state.quizList.filter(q=>state.answers[q.no]==='ng');
  retryWrong.disabled = wrongList.length===0;
  if(wrongList.length===0) retryWrong.style.opacity = 0.5;
  retryWrong.onclick = ()=>{
    state.quizList = wrongList;
    state.quizIndex = 0;
    state.revealed = false;
    state.answers = {};
    state.creature = null;
    state.hatched = false;
    state.screen = 'quiz';
    render();
  };
  const backBtn = el('button','btn-secondary','設定画面にもどる');
  backBtn.onclick = ()=>{ state.screen='setup'; state.creature=null; state.hatched=false; render(); };
  actions.appendChild(retryWrong);
  actions.appendChild(backBtn);
  main.appendChild(actions);

  root.appendChild(main);
}

/* ---------- render: stats screen ---------- */
async function renderStats(){
  root.innerHTML = '';
  const top = el('div','topbar');
  top.innerHTML = `<div class="brand"><span class="brand-mark">これまでの記録</span></div>`;
  const backBtn = el('button','icon-btn','戻る');
  backBtn.onclick = ()=>{ state.screen='setup'; render(); };
  top.appendChild(backBtn);
  root.appendChild(top);

  const main = el('main');
  const stats = await loadStats();
  const keys = Object.keys(stats);

  if(!keys.length){
    main.appendChild(el('div','empty-note','まだ記録がありません。<br>クイズを解くと、単元ごとの正答率がここに表示されます。'));
    root.appendChild(main);
    return;
  }

  const byUnit = {};
  QUESTIONS.forEach(q=>{
    const s = stats[q.no];
    if(!s || !s.attempts) return;
    const key = q.area+'｜'+q.unit;
    if(!byUnit[key]) byUnit[key] = {attempts:0, correct:0, area:q.area, unit:q.unit};
    byUnit[key].attempts += s.attempts;
    byUnit[key].correct += s.correct;
  });

  const sorted = Object.values(byUnit).sort((a,b)=> (a.correct/a.attempts) - (b.correct/b.attempts));

  main.appendChild(el('h2','section-title','単元別 正答率（苦手な順）'));
  sorted.forEach(d=>{
    const pct = Math.round(d.correct/d.attempts*100);
    const row = el('div','stat-row');
    row.innerHTML = `<div class="name">${d.unit}<span class="area">${d.area}・${d.attempts}回解答</span></div><div class="stat-rate">${pct}%</div>`;
    main.appendChild(row);
  });

  root.appendChild(main);
}

  const backBtn = el('button','icon-btn','戻る');
  backBtn.onclick = ()=>{ state.screen='setup'; render(); };
  top.appendChild(backBtn);
  root.appendChild(top);

  const main = el('main');
  const list = await loadCreatures();

  if(!list.length){
    main.appendChild(el('div','empty-note','まだ図鑑は空です。<br>クイズを最後まで解いて、生き物を孵化させてみてください。'));
    root.appendChild(main);
    return;
  }

  const stats = await loadStats();
  const lifeNow = lifetimeCorrect(stats);
  main.appendChild(el('div','range-hint', `これまでに孵化させた生き物：${list.length}体　／　累計正解数：${lifeNow}問`));
  main.appendChild(el('h2','section-title','これまでの生き物'));

  list.forEach(c=>{
    const q = QUALITIES[c.qualityIdx];
    const row = el('div','gallery-item');
    const dateStr = new Date(c.date).toLocaleDateString('ja-JP', {month:'numeric', day:'numeric'});
    row.innerHTML = `
      <div class="gsvg">${renderCreatureSVG(c)}</div>
      <div class="ginfo">
        <div class="gname">${c.name}</div>
        <div class="gmeta">${q.label}・${c.stageLabel}　${c.sessionCorrect}/${c.sessionTotal}問正解　${dateStr}</div>
      </div>
    `;
    main.appendChild(row);
  });

  root.appendChild(main);
}

/* ---------- router ---------- */
function render(){
  if(state.screen==='setup') renderSetup();
  else if(state.screen==='quiz') renderQuiz();
  else if(state.screen==='result') renderResult();
  else if(state.screen==='stats') renderStats();
  else if(state.screen==='gallery') renderGallery();
}

render();
</script>
</body>
</html>
